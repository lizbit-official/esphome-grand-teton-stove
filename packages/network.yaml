wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Loss of Wi-Fi/HA should not repeatedly reboot the serial bridge.
  reboot_timeout: 0s

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

binary_sensor:
  - platform: status
    name: "ESP API Connected"
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "ESP Uptime"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: debug
    reset_reason:
      name: "ESP Reset Reason"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Restart ESP"
    entity_category: diagnostic

debug:
  update_interval: 60s
