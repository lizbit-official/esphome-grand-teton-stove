# Sharp GP2Y0A41SK0F with the required 10k/10k divider to a 3.3V ADC pin.
# Works without a lid switch; both installed automatically enables gating.
substitutions:
  hopper_adc_pin: GPIO4
  # Deliberately uncalibrated: raw voltage works, estimate stays unknown.
  hopper_reference_voltage: "0.0"
  hopper_reference_distance_cm: "0.0"
  hopper_full_distance_cm: "4.0"
  hopper_empty_distance_cm: "30.0"

esphome:
  on_boot:
    # Register before the GPIO's initial state; no callback is installed when
    # this optional package is absent.
    priority: 800
    then:
      - lambda: |-
          stove_reporting::hopper_invalidation_callback() = []() {
            float value;
            if (stove_reporting::hopper_level_filter().update(NAN, millis(), value))
              id(hopper_pellet_level).publish_state(value);
            if (stove_reporting::hopper_voltage_filter().update(NAN, millis(), value))
              id(hopper_ir_voltage).publish_state(value);
            if (stove_reporting::hopper_distance_filter().update(NAN, millis(), value))
              id(hopper_pellet_distance).publish_state(value);
          };

sensor:
  - platform: template
    id: hopper_pellet_level
    name: "Hopper Pellet Level Estimated"
    icon: mdi:gauge
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: hopper_pellet_distance
    name: "Hopper Pellet Distance Estimated"
    unit_of_measurement: "cm"
    device_class: distance
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: hopper_ir_voltage
    name: "Hopper IR Voltage"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 3
    update_interval: never
  - platform: adc
    id: hopper_ir_sample
    internal: true
    pin: ${hopper_adc_pin}
    attenuation: 12db
    samples: 16
    update_interval: 200ms
    entity_category: diagnostic
    accuracy_decimals: 3
    filters:
      - multiply: 2.0
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 1
      - lambda: |-
          if (!stove_reporting::optional_hopper_sample_ready(
              id(hopper_lid_enabled), id(hopper_lid_known), id(hopper_lid_is_open),
              id(hopper_lid_changed_ms), millis())) return NAN;
          return x;
    on_value:
      - lambda: |-
          // Fast internal samples drive the median even when exposed
          // diagnostics are waiting for their next 15-second publication.
          float value;
          if (stove_reporting::hopper_level_filter().update(stove_reporting::estimated_pellet_level(
              x, ${hopper_reference_voltage}, ${hopper_reference_distance_cm},
              ${hopper_full_distance_cm}, ${hopper_empty_distance_cm}), millis(), value))
            id(hopper_pellet_level).publish_state(value);
          if (stove_reporting::hopper_voltage_filter().update(x, millis(), value))
            id(hopper_ir_voltage).publish_state(value);
          if (stove_reporting::hopper_distance_filter().update(stove_reporting::estimated_pellet_distance_cm(
              x, ${hopper_reference_voltage}, ${hopper_reference_distance_cm}), millis(), value))
            id(hopper_pellet_distance).publish_state(value);
