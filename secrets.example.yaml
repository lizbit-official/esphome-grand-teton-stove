# Copy to secrets.yaml (ignored by Git) and replace every value.
wifi_ssid: "REPLACE_WITH_WIFI_SSID"
wifi_password: "REPLACE_WITH_WIFI_PASSWORD"
# Generate a unique key: openssl rand -base64 32
api_encryption_key: "REPLACE_WITH_BASE64_32_BYTE_KEY"
# Generate a separate password: openssl rand -hex 24
ota_password: "REPLACE_WITH_OTA_PASSWORD"
# Only needed if you enable packages/web-server.yaml.
web_username: "REPLACE_WITH_WEB_USERNAME"
web_password: "REPLACE_WITH_WEB_PASSWORD"
